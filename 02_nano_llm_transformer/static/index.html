<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Nano LLM Chat</title><style>body{font:16px system-ui;max-width:720px;margin:3rem auto;padding:0 1rem;background:#101522;color:#eef}textarea,button,input{font:inherit}textarea{width:100%;height:7rem}label{display:block;margin:1rem 0}pre{white-space:pre-wrap;background:#20283a;padding:1rem}</style></head>
<body><h1>Nano LLM Chat</h1><p>Educational tiny model: output quality is intentionally limited.</p>
<form id="form"><textarea id="prompt">User: hello&#10;Bot:</textarea>
<label>Temperature <input id="temperature" type="number" min="0.1" max="3" step="0.1" value="0.8"></label>
<label>Top-k <input id="topk" type="number" min="1" value="10"></label><button>Generate</button></form><pre id="output">Ready.</pre>
<script>form.onsubmit=async(e)=>{e.preventDefault();output.textContent='Generating…';try{const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt.value,temperature:+temperature.value,top_k:+topk.value,max_new_tokens:40})});const d=await r.json();output.textContent=r.ok?d.text:(d.detail||'Error')}catch(e){output.textContent=e.message}}</script></body></html>
