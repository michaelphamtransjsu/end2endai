<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NYC Taxi Trip Duration</title><style>
body{font:16px system-ui;margin:0;background:#10212b;color:#eef7fa}.card{max-width:700px;margin:4rem auto;background:#173441;padding:2rem;border-radius:18px;box-shadow:0 12px 40px #0008}h1{color:#ffd23f}form{display:grid;grid-template-columns:1fr 1fr;gap:1rem}label{display:grid;gap:.3rem}input,button{padding:.7rem;border-radius:7px;border:1px solid #77949e}button{grid-column:1/-1;background:#ffd23f;font-weight:700;cursor:pointer}#result{font-size:1.3rem;min-height:2rem}@media(max-width:600px){form{grid-template-columns:1fr}.card{margin:1rem}}
</style></head><body><main class="card"><h1>NYC taxi duration</h1><p>Estimate duration from pickup time and coordinates.</p><form id="form">
<label>Pickup time<input name="pickup_datetime" type="datetime-local" value="2016-06-15T17:30" required></label><label>Passengers<input name="passenger_count" type="number" min="1" max="8" value="1" required></label>
<label>Pickup latitude<input name="pickup_latitude" type="number" step="any" value="40.758" required></label><label>Pickup longitude<input name="pickup_longitude" type="number" step="any" value="-73.9855" required></label>
<label>Dropoff latitude<input name="dropoff_latitude" type="number" step="any" value="40.7306" required></label><label>Dropoff longitude<input name="dropoff_longitude" type="number" step="any" value="-73.9352" required></label><button>Predict duration</button></form><p id="result" aria-live="polite"></p></main><script>
form.onsubmit=async(e)=>{e.preventDefault();result.textContent='Predicting…';const d=Object.fromEntries(new FormData(form));for(const k of Object.keys(d))if(k!=='pickup_datetime')d[k]=Number(d[k]);try{const r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});const j=await r.json();if(!r.ok)throw Error(j.detail||'Request failed');result.textContent=`Estimated time: ${j.predicted_duration_minutes} minutes (${j.predicted_duration_seconds} seconds)`}catch(x){result.textContent=`Error: ${x.message}`}}
</script></body></html>
