[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-taxi-duration-mvp"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.116.1", "uvicorn==0.35.0", "pandas==2.3.2",
  "numpy==2.2.6", "scikit-learn==1.7.1", "joblib==1.5.2", "pydantic==2.11.7"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
